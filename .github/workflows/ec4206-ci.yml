name: EC4206 CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/campus_ci
      SELENIUM_EVIDENCE_DIR: ${{ github.workspace }}/ci-evidence/selenium
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install locked dependencies
        run: |
          mkdir -p ci-evidence
          npm ci --ignore-scripts 2>&1 | tee ci-evidence/frontend-install.txt
          npm ci --ignore-scripts --prefix backend 2>&1 | tee ci-evidence/backend-install.txt
      - name: Lint frontend
        run: npm run lint 2>&1 | tee ci-evidence/lint.txt
      - name: Build frontend
        run: npm run build 2>&1 | tee ci-evidence/build.txt
      - name: Run backend regression
        run: |
          mkdir -p coverage
          node --test --experimental-test-coverage \
            --test-coverage-include='backend/**/*.js' \
            --test-coverage-exclude='backend/node_modules/**' \
            --test-coverage-exclude='backend/tests/**' \
            --test-reporter=tap --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=coverage/backend-regression.lcov \
            'backend/tests/*.test.js' 2>&1 | tee ci-evidence/backend.txt
          grep -q '^SF:backend/' coverage/backend-regression.lcov
      - name: Upload backend LCOV
        uses: actions/upload-artifact@v4
        with:
          name: backend-lcov
          path: coverage/backend-regression.lcov
          if-no-files-found: error
      - name: Run Cucumber
        run: npm --prefix backend run test:bdd 2>&1 | tee ci-evidence/cucumber.txt
      - name: Run headless Chrome Selenium tests
        run: |
          google-chrome --version 2>&1 | tee ci-evidence/chrome.txt
          npm --prefix backend run test:ui 2>&1 | tee ci-evidence/selenium.tap
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ec4206-ci-evidence
          path: ci-evidence/
      - name: Package verified frontend build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smart-campus-frontend
          path: dist/
          if-no-files-found: error

  sonarqube:
    needs: verify
    if: >-
      (github.event_name == 'push' &&
       github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'pull_request' &&
       github.base_ref == github.event.repository.default_branch &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download backend LCOV
        uses: actions/download-artifact@v4
        with:
          name: backend-lcov
          path: coverage/
      - name: Authenticate to SonarQube Cloud
        uses: SonarSource/sonarqube-auth-action@a0aa643acde4162396015b4f12536c1b9c4aab82 # v1
        with:
          project-key: raveeshajayamaha_smart-campus-assistant_sqa
      - name: Scan with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
